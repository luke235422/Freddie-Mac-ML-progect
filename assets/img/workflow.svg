<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowDown" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1,1 L9,6 L1,11" fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRight" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1,1 L9,6 L1,11" fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- column headers -->
  <text x="280" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#4f46e5" letter-spacing="3">ML PIPELINE</text>
  <text x="920" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#ea580c" letter-spacing="3">POWER BI</text>

  <!-- ===== LEFT: ML steps ===== -->
  <g>
    <rect x="60" y="100" width="440" height="88" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="280" y="155" text-anchor="middle" font-size="34" font-weight="700" fill="#1e1b4b">DATA &amp; TARGET</text>

    <rect x="60" y="224" width="440" height="88" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="280" y="279" text-anchor="middle" font-size="34" font-weight="700" fill="#1e1b4b">EDA</text>

    <rect x="60" y="348" width="440" height="88" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="280" y="403" text-anchor="middle" font-size="34" font-weight="700" fill="#1e1b4b">PIPELINE &amp; MODEL</text>

    <rect x="60" y="472" width="440" height="88" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="280" y="527" text-anchor="middle" font-size="34" font-weight="700" fill="#1e1b4b">EVALUATION</text>

    <rect x="60" y="596" width="440" height="88" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="280" y="651" text-anchor="middle" font-size="34" font-weight="700" fill="#1e1b4b">EXPLAINABILITY</text>
  </g>

  <!-- vertical flow arrows -->
  <g stroke="#4f46e5" stroke-width="3" fill="none">
    <line x1="280" y1="188" x2="280" y2="212" marker-end="url(#arrowDown)"/>
    <line x1="280" y1="312" x2="280" y2="336" marker-end="url(#arrowDown)"/>
    <line x1="280" y1="436" x2="280" y2="460" marker-end="url(#arrowDown)"/>
    <line x1="280" y1="560" x2="280" y2="584" marker-end="url(#arrowDown)"/>
  </g>

  <!-- ===== RIGHT: dashboard pages ===== -->
  <g>
    <rect x="700" y="104" width="440" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="920" y="152" text-anchor="middle" font-size="30" font-weight="700" fill="#431407">OVERVIEW</text>

    <rect x="700" y="204" width="440" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="920" y="252" text-anchor="middle" font-size="30" font-weight="700" fill="#431407">NUMERICAL RISK</text>

    <rect x="700" y="304" width="440" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="920" y="352" text-anchor="middle" font-size="30" font-weight="700" fill="#431407">CATEGORICAL RISK</text>

    <rect x="700" y="454" width="440" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="920" y="502" text-anchor="middle" font-size="30" font-weight="700" fill="#431407">THRESHOLD EXPLORER</text>

    <rect x="700" y="554" width="440" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="920" y="602" text-anchor="middle" font-size="30" font-weight="700" fill="#431407">LOAN EXPLORER</text>

    <rect x="700" y="654" width="440" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="920" y="702" text-anchor="middle" font-size="30" font-weight="700" fill="#431407">RANKING TABLE</text>
  </g>

  <!-- ===== cross links ===== -->
  <g stroke="#f97316" stroke-width="2.8" fill="none" stroke-dasharray="8 7">
    <path d="M500 144 L690 142" marker-end="url(#arrowRight)"/>
    <path d="M500 258 C600 254, 600 242, 690 242" marker-end="url(#arrowRight)"/>
    <path d="M500 285 C600 296, 600 342, 690 342" marker-end="url(#arrowRight)"/>
    <path d="M500 516 C600 514, 600 492, 690 492" marker-end="url(#arrowRight)"/>
    <path d="M500 628 C600 624, 600 592, 690 592" marker-end="url(#arrowRight)"/>
    <path d="M500 652 C600 662, 600 692, 690 692" marker-end="url(#arrowRight)"/>
  </g>
</svg>
