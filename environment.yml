# Conda alternative to requirements.txt.
#   conda env create -f environment.yml
#   conda activate ml-env
#   python -m ipykernel install --user --name ml-env --display-name "ML (Python 3.12)"
#
# Conda is the easier route on Apple Silicon, where xgboost needs libomp.
name: ml-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas>=2.1
  - numpy>=1.26
  - scipy>=1.11
  - scikit-learn>=1.4
  - py-xgboost>=2.0
  - libomp                # required by xgboost on macOS
  - category_encoders>=2.6
  - shap>=0.44
  - matplotlib>=3.8
  - seaborn>=0.13
  - pyarrow>=15.0
  - joblib>=1.3
  - jupyterlab>=4.0
  - ipykernel>=6.29
  - ipywidgets>=8.1
  - pip
  - pip:
      - eli5>=0.13
